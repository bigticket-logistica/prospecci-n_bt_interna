<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#002E5D" />
    <meta name="description" content="Tus rutas, tus pagos, tus facturas y tus reclamos con Bigticket." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bigticket" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Portal Terceros · Bigticket</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // El service worker solo se registra en el navegador. Dentro de la
      // aplicación de Android, Capacitor sirve los archivos desde el teléfono
      // y registrarlo ahí solo agregaría una capa que puede fallar.
      // Capacitor sirve la aplicación desde https://localhost, así que la sola
      // comprobación del protocolo no basta: dentro de la aplicación el
      // service worker servía una copia vieja y dejaba la pantalla en blanco.
      if ('serviceWorker' in navigator && location.protocol === 'https:'
          && !window.Capacitor?.isNativePlatform?.()) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {})
        })
      }
    </script>
  </body>
</html>
